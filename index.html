<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS-PAY 💳</title>
  <!-- Google Fonts & Lucide Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 25, 41, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-cyan: #00f2fe;
      --primary-purple: #9d4edd;
      --accent-pink: #ff2a85;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --success-green: #10b981;
      --danger-red: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(157, 78, 221, 0.12) 0%, transparent 45%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Sleek Top Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 12px rgba(0, 242, 254, 0.3);
    }

    .logo-text {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--success-green);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--success-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Main Title Section - Restored Cyan to Purple Gradient */
    .title-card {
      text-align: center;
      margin-bottom: 22px;
      padding: 6px 10px;
    }

    .main-title {
      font-size: 1.7rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--primary-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .main-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Navigation Tabs - Restored Cyan to Purple Active Gradient */
    .nav-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 5px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      margin-bottom: 22px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary-purple) 0%, var(--primary-cyan) 100%);
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(0, 242, 254, 0.35);
    }

    /* Glass Cards */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    /* Centered Balance Section */
    .balance-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .balance-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .balance-amount {
      font-size: 2.7rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -1px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .stat-box.credit { border-left: 3px solid var(--success-green); }
    .stat-box.debit { border-left: 3px solid var(--danger-red); }

    .stat-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .stat-val.credit { color: var(--success-green); }
    .stat-val.debit { color: var(--danger-red); }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-btn {
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .type-btn {
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
    }

    .type-btn.active.debit {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--danger-red);
      color: #f87171;
    }

    .type-btn.active.credit {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success-green);
      color: #34d399;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-cyan);
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.35);
      margin-top: 10px;
    }

    /* Transaction List */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .month-select {
      width: auto;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
    }

    .tx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tx-item:last-child {
      border-bottom: none;
    }

    .tx-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
    }

    .tx-icon.debit { background: rgba(239, 68, 68, 0.12); color: var(--danger-red); }
    .tx-icon.credit { background: rgba(16, 185, 129, 0.12); color: var(--success-green); }

    .tx-info { flex: 1; }
    .tx-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
    .tx-meta { font-size: 0.75rem; color: var(--text-muted); }
    .tx-amount-box { text-align: right; }
    .tx-amount { font-weight: 700; font-size: 0.95rem; }
    .tx-amount.debit { color: var(--danger-red); }
    .tx-amount.credit { color: var(--success-green); }
    .tx-bal { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Clean Top Navbar -->
    <header>
      <div class="logo-container">
        <div class="logo-icon"><i data-lucide="wallet"></i></div>
        <div class="logo-text">NEXUS-PAY</div>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div>
        Live Sync
      </div>
    </header>

    <!-- Main Title Card with Purple-Cyan Gradient -->
    <div class="title-card">
      <h1 class="main-title">Personal Expense Tracker 💸</h1>
      <p class="main-subtitle">Smart Real-Time Budgeting & Transaction Ledger 📊</p>
    </div>

    <!-- View Tabs with Purple-Cyan Gradient -->
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-overview" onclick="switchTab('overview')">
        <i data-lucide="layout-dashboard"></i> Overview
      </button>
      <button class="tab-btn" id="tab-add" onclick="switchTab('add')">
        <i data-lucide="plus-circle"></i> Add Transaction
      </button>
    </div>

    <!-- OVERVIEW TAB -->
    <div id="view-overview">
      <div class="glass-card">
        <!-- Centered Available Balance -->
        <div class="balance-box">
          <div class="balance-label">AVAILABLE BALANCE 💰</div>
          <div class="balance-amount" id="total-balance">₹0.00</div>
        </div>
        
        <div class="stats-grid">
          <div class="stat-box credit">
            <div class="stat-title">CREDITED 📥</div>
            <div class="stat-val credit" id="total-credited">+₹0</div>
          </div>
          <div class="stat-box debit">
            <div class="stat-title">SPENT 📤</div>
            <div class="stat-val debit" id="total-spent">-₹0</div>
          </div>
        </div>

        <div class="quick-actions">
          <button class="action-btn" onclick="openAddForm('CREDIT')">
            <i data-lucide="plus" style="color:#10b981;"></i> Add Money Received
          </button>
          <button class="action-btn" onclick="openAddForm('DEBIT')">
            <i data-lucide="minus" style="color:#ef4444;"></i> Add Expense Spent
          </button>
        </div>
      </div>

      <!-- Recent Transactions -->
      <div class="glass-card">
        <div class="section-header">
          <h3 style="font-size: 1.05rem; font-weight: 700;">Recent Transactions 📜</h3>
          <select class="month-select" id="month-filter" onchange="renderTransactions()">
            <option value="ALL">All Time</option>
            <option value="2026-09" selected>Sep 2026</option>
            <option value="2026-08">Aug 2026</option>
            <option value="2026-07">Jul 2026</option>
          </select>
        </div>

        <div id="transaction-list">
          <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 10px;">Loading live data...</p>
        </div>
      </div>
    </div>

    <!-- ADD TRANSACTION TAB -->
    <div id="view-add" class="hidden">
      <div class="glass-card">
        <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; text-align: center;">Log New Transaction 📝</h3>

        <div class="type-selector">
          <button type="button" class="type-btn active debit" id="btn-debit" onclick="setType('DEBIT')">
            Spent 📤<br><span style="font-size: 0.75rem; font-weight: normal;">(Expense)</span>
          </button>
          <button type="button" class="type-btn credit" id="btn-credit" onclick="setType('CREDIT')">
            Received 📥<br><span style="font-size: 0.75rem; font-weight: normal;">(Credit)</span>
          </button>
        </div>

        <form id="tx-form" onsubmit="handleFormSubmit(event)">
          <input type="hidden" id="tx-type" value="DEBIT">

          <div class="form-group">
            <label class="form-label">Date 📅</label>
            <input type="date" id="tx-date" required>
          </div>

          <div class="form-group">
            <label class="form-label">Amount (₹) 💵</label>
            <input type="number" id="tx-amount" placeholder="e.g. 250" step="any" required>
          </div>

          <div class="form-group">
            <label class="form-label">Category 🏷️</label>
            <select id="tx-category" required>
              <option value="Food & Snacks 🍔">Food & Snacks 🍔</option>
              <option value="Academics & Books 📚">Academics & Books 📚</option>
              <option value="Travel & Transport 🚌">Travel & Transport 🚌</option>
              <option value="Hostel & Personal 🏠">Hostel & Personal 🏠</option>
              <option value="Pocket Money / Income 💵">Pocket Money / Income 💵</option>
              <option value="Others 🛍️">Others 🛍️</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Reason / Item Description 📝</label>
            <input type="text" id="tx-reason" placeholder="e.g. Snack bar at canteen" required>
          </div>

          <div class="form-group">
            <label class="form-label">Attach Receipt / Screenshot 📸 (Optional)</label>
            <input type="file" id="tx-file" accept="image/*">
          </div>

          <button type="submit" id="submit-btn" class="submit-btn">Save Record ✅</button>
        </form>
      </div>
    </div>

  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Google Apps Script Web App Endpoint
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6AiqVli1bo_O03aQjVn7ceKBpGMqmNOPXQZCzOQGSOaQ5IqMxjZZkDx6wdiXy0owfJw/exec";

    let globalData = [];

    // Set Default Date to Today
    document.getElementById('tx-date').valueAsDate = new Date();

    function switchTab(tab) {
      const overviewTab = document.getElementById('tab-overview');
      const addTab = document.getElementById('tab-add');
      const overviewView = document.getElementById('view-overview');
      const addView = document.getElementById('view-add');

      if (tab === 'overview') {
        overviewTab.classList.add('active');
        addTab.classList.remove('active');
        overviewView.classList.remove('hidden');
        addView.classList.add('hidden');
      } else {
        addTab.classList.add('active');
        overviewTab.classList.remove('active');
        addView.classList.remove('hidden');
        overviewView.classList.add('hidden');
      }
    }

    function setType(type) {
      document.getElementById('tx-type').value = type;
      const btnDebit = document.getElementById('btn-debit');
      const btnCredit = document.getElementById('btn-credit');

      if (type === 'DEBIT') {
        btnDebit.classList.add('active', 'debit');
        btnCredit.classList.remove('active', 'credit');
      } else {
        btnCredit.classList.add('active', 'credit');
        btnDebit.classList.remove('active', 'debit');
      }
    }

    function openAddForm(type) {
      setType(type);
      switchTab('add');
    }

    async function fetchLiveData() {
      try {
        const response = await fetch(SCRIPT_URL);
        globalData = await response.json();
        
        // Calculate Totals
        let currentBalance = 0;
        let totalCredited = 0;
        let totalSpent = 0;

        if (globalData.length > 0) {
          const lastItem = globalData[globalData.length - 1];
          currentBalance = parseFloat(lastItem.calculatedBal || 0);

          globalData.forEach(item => {
            const amt = parseFloat(item.amount || 0);
            if (item.type === 'CREDIT') totalCredited += amt;
            else if (item.type === 'DEBIT') totalSpent += amt;
          });
        }

        // Update Dashboard Display
        document.getElementById('total-balance').innerText = `₹${currentBalance.toLocaleString('en-IN')}`;
        document.getElementById('total-credited').innerText = `+₹${totalCredited.toLocaleString('en-IN')}`;
        document.getElementById('total-spent').innerText = `-₹${totalSpent.toLocaleString('en-IN')}`;

        renderTransactions();
      } catch (err) {
        console.error("Failed to load sheet data:", err);
        document.getElementById('transaction-list').innerHTML = `<p style="text-align: center; color: var(--danger-red); font-size: 0.85rem; padding: 10px;">Error syncing data.</p>`;
      }
    }

    function renderTransactions() {
      const filter = document.getElementById('month-filter').value;
      const listContainer = document.getElementById('transaction-list');
      listContainer.innerHTML = '';

      let filteredData = [...globalData].reverse();

      if (filter !== 'ALL') {
        filteredData = filteredData.filter(item => {
          if (!item.date) return false;
          // Matches YYYY-MM
          return item.date.startsWith(filter);
        });
      }

      if (filteredData.length === 0) {
        listContainer.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 16px;">No transactions recorded for this period.</p>`;
        return;
      }

      filteredData.forEach(item => {
        const isCredit = item.type === 'CREDIT';
        const amt = parseFloat(item.amount).toLocaleString('en-IN');
        const bal = parseFloat(item.calculatedBal || 0).toLocaleString('en-IN');
        
        const txDiv = document.createElement('div');
        txDiv.className = 'tx-item';
        txDiv.innerHTML = `
          <div class="tx-icon ${isCredit ? 'credit' : 'debit'}">
            <i data-lucide="${isCredit ? 'arrow-down-left' : 'arrow-up-right'}"></i>
          </div>
          <div class="tx-info">
            <div class="tx-title">${item.reason}</div>
            <div class="tx-meta">${item.date} • ${item.category} ${item.screenshot ? `<a href="${item.screenshot}" target="_blank" style="color:var(--primary-cyan); margin-left:5px;">[Receipt]</a>` : ''}</div>
          </div>
          <div class="tx-amount-box">
            <div class="tx-amount ${isCredit ? 'credit' : 'debit'}">${isCredit ? '+' : '-'}₹${amt}</div>
            <div class="tx-bal">Bal: ₹${bal}</div>
          </div>
        `;
        listContainer.appendChild(txDiv);
      });

      lucide.createIcons();
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = 'Saving Record... ⏳';

      const fileInput = document.getElementById('tx-file');
      let fileData = null, fileName = null, fileType = null;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileName = file.name;
        fileType = file.type;
        fileData = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
      }

      const payload = {
        id: "TXN_" + Date.now(),
        date: document.getElementById('tx-date').value,
        type: document.getElementById('tx-type').value,
        category: document.getElementById('tx-category').value,
        reason: document.getElementById('tx-reason').value,
        amount: document.getElementById('tx-amount').value,
        fileData, fileName, fileType
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        document.getElementById('tx-form').reset();
        document.getElementById('tx-date').valueAsDate = new Date();
        setType('DEBIT');

        await fetchLiveData();
        switchTab('overview');
      } catch (err) {
        alert('Failed to log transaction. Check internet connection.');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Save Record ✅';
      }
    }

    // Load Live Data on Startup
    fetchLiveData();
  </script>
</body>
</html>
