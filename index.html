<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Ledger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #0f172a, #020617);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
    }
    .glass-input:focus {
      border-color: #6366f1;
      outline: none;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen pb-12">

  <!-- Header -->
  <header class="py-6 text-center border-b border-slate-800/80 mb-8">
    <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">
      Personal Ledger 💎
    </h1>
    <p class="text-xs text-slate-400 mt-1">Real-time Cloud Sync & Expense Dashboard</p>
  </header>

  <main class="max-w-xl mx-auto px-4 space-y-6">

    <!-- Total Balance Card -->
    <div class="glass-card rounded-2xl p-6 text-center relative overflow-hidden">
      <div class="absolute -right-10 -top-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
      <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-400">Current Balance</h2>
      <p id="totalBalance" class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200 mt-2">
        ₹0.00
      </p>
    </div>

    <!-- Chart -->
    <div class="glass-card rounded-2xl p-5">
      <h3 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
        <span>📊</span> Expense Breakdown
      </h3>
      <div class="relative max-h-56 flex justify-center">
        <canvas id="expenseChart"></canvas>
      </div>
    </div>

    <!-- Form -->
    <div class="glass-card rounded-2xl p-6">
      <h3 class="text-base font-semibold text-slate-200 mb-5 flex items-center gap-2">
        <span>✏️</span> Add Transaction
      </h3>

      <form id="ledgerForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Type</label>
          <select id="type" class="glass-input w-full rounded-xl p-3 text-sm font-medium">
            <option value="DEBIT" class="bg-slate-900 text-red-400">🔴 Debit (Expense)</option>
            <option value="CREDIT" class="bg-slate-900 text-emerald-400">🟢 Credit (Income)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Category</label>
          <input type="text" id="category" placeholder="e.g. Food, Travel, Rent" required class="glass-input w-full rounded-xl p-3 text-sm placeholder-slate-600">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Reason / Note</label>
          <input type="text" id="reason" placeholder="e.g. Dinner with Mom" required class="glass-input w-full rounded-xl p-3 text-sm placeholder-slate-600">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Amount (₹)</label>
          <input type="number" id="amount" placeholder="0.00" step="0.01" required class="glass-input w-full rounded-xl p-3 text-sm placeholder-slate-600">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Screenshot / Receipt (Optional)</label>
          <input type="file" id="fileInput" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600/30 file:text-indigo-300 hover:file:bg-indigo-600/50">
        </div>

        <button type="submit" id="submitBtn" class="w-full mt-2 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-500/25 transition duration-200 text-sm tracking-wide">
          Save Record ✅
        </button>
      </form>
    </div>

    <!-- History -->
    <div class="glass-card rounded-2xl p-6">
      <h3 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
        <span>🕒</span> Recent Activity
      </h3>
      <div id="historyList" class="space-y-3">
        <p class="text-xs text-slate-500 text-center py-4">Loading ledger...</p>
      </div>
    </div>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6AiqVli1bo_O03aQjVn7ceKBpGMqmNOPXQZCzOQGSOaQ5IqMxjZZkDx6wdiXy0owfJw/exec";

    let chartInstance = null;

    async function loadData() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        if (data.length > 0) {
          const latestBal = data[data.length - 1].calculatedBal || 0;
          document.getElementById('totalBalance').innerText = `₹${parseFloat(latestBal).toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
        } else {
          document.getElementById('totalBalance').innerText = `₹0.00`;
        }

        renderHistory(data);
        renderChart(data);
      } catch (err) {
        console.error("Error loading data:", err);
        document.getElementById('historyList').innerHTML = `<p class="text-xs text-red-400 text-center py-4">Failed to fetch transactions.</p>`;
      }
    }

    function renderHistory(data) {
      const container = document.getElementById('historyList');
      container.innerHTML = "";

      if (data.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No records found yet.</p>`;
        return;
      }

      [...data].reverse().forEach(item => {
        const isCredit = item.type === "CREDIT";
        const div = document.createElement('div');
        div.className = "flex items-center justify-between p-3.5 rounded-xl bg-slate-900/40 border border-slate-800/60 hover:border-slate-700/80 transition duration-150";
        div.innerHTML = `
          <div>
            <p class="font-semibold text-sm text-slate-200">${item.reason} <span class="text-xs text-slate-500 font-normal">(${item.category})</span></p>
            <p class="text-[10px] text-slate-500 mt-0.5">${item.date}</p>
            ${item.screenshot ? `<a href="${item.screenshot}" target="_blank" class="text-[11px] text-indigo-400 hover:text-indigo-300 underline mt-1 inline-block">📎 View Receipt</a>` : ''}
          </div>
          <div class="text-right">
            <p class="font-bold text-sm ${isCredit ? 'text-emerald-400' : 'text-rose-400'}">
              ${isCredit ? '+' : '-'}₹${parseFloat(item.amount).toLocaleString('en-IN', {minimumFractionDigits: 2})}
            </p>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderChart(data) {
      const categoryTotals = {};
      data.filter(i => i.type === "DEBIT").forEach(i => {
        categoryTotals[i.category] = (categoryTotals[i.category] || 0) + parseFloat(i.amount);
      });

      const ctx = document.getElementById('expenseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(categoryTotals),
          datasets: [{
            data: Object.values(categoryTotals),
            backgroundColor: ['#818cf8', '#38bdf8', '#34d399', '#facc15', '#c084fc', '#f472b6'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 11 } }
            }
          }
        }
      });
    }

    document.getElementById('ledgerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Saving... ⏳";

      const fileInput = document.getElementById('fileInput');
      let fileData = null, fileName = null, fileType = null;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileName = file.name;
        fileType = file.type;
        fileData = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
      }

      const payload = {
        id: "TXN_" + Date.now(),
        date: new Date().toLocaleDateString(),
        type: document.getElementById('type').value,
        category: document.getElementById('category').value,
        reason: document.getElementById('reason').value,
        amount: document.getElementById('amount').value,
        fileData, fileName, fileType
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        document.getElementById('ledgerForm').reset();
        await loadData();
      } catch (err) {
        alert("Failed to save transaction.");
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Save Record ✅";
      }
    });

    loadData();
  </script>
</body>
</html>
